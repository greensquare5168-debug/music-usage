<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音樂使用狀況｜廠牌</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="crumb"><a href="index.html">← 回廠牌總覽</a>　/　<b id="brand">—</b></div>
  <header>
    <h1 id="h1">—</h1>
    <div class="sub">知識平台網・罐頭音樂研究所　｜　該廠牌專輯的站上使用狀況（資料日 <span id="srcdate">—</span>）</div>
    <div class="chips" id="chips"></div>
    <div class="err" id="err">找不到這個廠牌，或載入 stats.json 失敗。<a href="index.html">回廠牌總覽</a></div>
  </header>

  <div class="grid">
    <div class="card wide">
      <h2>專輯清單</h2>
      <p class="hint">共 <span id="acount">—</span> 張　·　排序：
        <span class="seg" id="sortbar">
          <button data-sort="count" class="on">使用頁數</button>
          <button data-sort="az">A–Z</button>
        </span></p>
      <table><thead><tr><th style="width:44px">#</th><th style="width:120px">編號</th><th>專輯名稱</th><th class="n">使用頁數</th><th style="width:150px"></th></tr></thead>
        <tbody id="alist"></tbody></table>
    </div>
  </div>

  <footer>
    資料來源：<code>全站專輯_未建_依使用排序_含平台_20261003.txt</code>　｜　產生時間：<span id="gen">—</span>
  </footer>
</div>

<script>
const NUM = n => n.toLocaleString('en-US');
const params = new URLSearchParams(location.search);
const want = params.get('b') || '';

fetch('stats.json',{cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
.then(d=>{
  const lab = d.labels.find(l => l.name === want);
  if (!lab) throw new Error('brand not found');
  document.title = '音樂使用狀況｜' + lab.name;
  document.getElementById('brand').textContent = lab.name;
  document.getElementById('h1').textContent = '🏷️ ' + lab.name;
  document.getElementById('srcdate').textContent = d.source_date;
  document.getElementById('gen').textContent = d.generated;
  document.getElementById('chips').innerHTML = [
    ['使用頁數', lab.total], ['專輯數', lab.n],
    ['最多的一張', lab.albums[0] ? lab.albums[0].count : 0]
  ].map(([l,n])=>`<div class="chip"><div class="n">${NUM(n)}</div><div class="l">${l}</div></div>`).join('');

  const alb = lab.albums;
  document.getElementById('acount').textContent = NUM(alb.length);
  let sortMode = 'count';
  function renderAlb(){
    const list = alb.slice();
    if (sortMode === 'az') list.sort((a,b)=>a.code.localeCompare(b.code,'en',{numeric:true}) || a.title.localeCompare(b.title));
    else                    list.sort((a,b)=>b.count - a.count || a.code.localeCompare(b.code,'en',{numeric:true}));
    const max = list.length ? Math.max(...list.map(a=>a.count)) : 1;
    document.getElementById('alist').innerHTML = list.map((a,i)=>`
      <tr><td><span class="rank">${i+1}</span></td><td class="code">${a.code}</td><td>${a.title||'<span class="muted">—</span>'}</td>
        <td class="n">${NUM(a.count)}</td>
        <td><span class="bar-mini" style="width:${Math.round(a.count/max*170)}px;background:#12b5a5"></span></td></tr>`).join('');
  }
  renderAlb();
  document.getElementById('sortbar').addEventListener('click', ev=>{
    const b = ev.target.closest('button[data-sort]'); if(!b) return;
    sortMode = b.dataset.sort;
    [...ev.currentTarget.querySelectorAll('button')].forEach(x=>x.classList.toggle('on', x===b));
    renderAlb();
  });
}).catch(e=>{ document.getElementById('err').style.display='block'; console.error(e); });
</script>
</body>
</html>
