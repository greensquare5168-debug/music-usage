<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音樂使用狀況｜廠牌 → 專輯</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎵 音樂使用狀況</h1>
    <div class="sub">知識平台網・罐頭音樂研究所　｜　依全站索引統計（資料日 <span id="srcdate">—</span>）<br>
      先看<b>廠牌</b>，點進去再看該廠牌的<b>專輯</b>。</div>
    <div class="chips" id="chips"></div>
    <div class="note" id="unknown" style="display:none"></div>
    <div class="err" id="err">載入 stats.json 失敗。請確認與 index.html 同目錄，並以 http(s) 開啟。</div>
  </header>

  <div class="grid">
    <div class="card wide">
      <h2>全部廠牌（點列進入專輯）</h2>
      <p class="hint">共 <span id="labcount">—</span> 個廠牌</p>
      <table><thead><tr><th style="width:44px">#</th><th>廠牌</th><th class="n">使用頁數</th><th class="n">專輯數</th><th style="width:180px"></th></tr></thead>
        <tbody id="lablist"></tbody></table>
    </div>
  </div>

  <footer>
    資料來源：<code>網站音樂索引/all_20260925_full.jsonl</code>、<code>全站專輯_未建_依使用排序_含平台_20261003.txt</code><br>
    產生時間：<span id="gen">—</span>　｜　重跑更新：<code>python3 build_stats.py</code>
  </footer>
</div>

<script>
const NUM = n => n.toLocaleString('en-US');
const enc = s => encodeURIComponent(s);
const go  = name => { location.href = 'label.html?b=' + enc(name); };

function makeBar(boxId, labels, values, color, height, onClick){
  const box = document.getElementById(boxId);
  box.style.height = height + 'px';
  const ctx = document.createElement('canvas');
  box.appendChild(ctx);
  return new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets:[{ data:values, backgroundColor:color,
           borderRadius:5, borderSkipped:false, maxBarThickness:20 }] },
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false,
      animation:{duration:600},
      onClick:(e,els)=>{ if(els.length && onClick) onClick(els[0].index); },
      onHover:(e,els)=>{ e.native.target.style.cursor = els.length&&onClick ? 'pointer':'default'; },
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label:c=>' '+NUM(c.raw)+' 頁' } } },
      scales:{
        x:{beginAtZero:true, grid:{color:'#eef1f7'}, ticks:{font:{size:11}, color:'#6b7688', precision:0}},
        y:{grid:{display:false}, ticks:{font:{size:11}, color:'#1e2430', autoSkip:false}}
      }
    }
  });
}

fetch('stats.json',{cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
.then(d=>{
  document.getElementById('srcdate').textContent = d.source_date;
  document.getElementById('gen').textContent = d.generated;
  const s = d.summary;
  document.getElementById('chips').innerHTML = [
    ['廠牌數', s.labels], ['專輯數', s.albums], ['音樂頁面數', s.pages], ['曲目紀錄筆數', s.records]
  ].map(([l,n])=>`<div class="chip"><div class="n">${NUM(n)}</div><div class="l">${l}</div></div>`).join('');

  const unk = d.labels.filter(l => l.name.startsWith('（'))[0];
  const labels = d.labels.filter(l => !l.name.startsWith('（'));

  if (unk){
    const n = document.getElementById('unknown');
    n.style.display = 'block';
    n.innerHTML = `⚠️ 有 <b>${NUM(unk.n)}</b> 張專輯（使用 <b>${NUM(unk.total)}</b> 頁）在資料裡<b>沒有標廠牌</b>，
      未列入排行 —— <a href="label.html?b=${enc(unk.name)}">點此查看 ${unk.name}</a>。之後可補齊。`;
  }

  document.getElementById('labcount').textContent = NUM(d.labels.length);
  const max = d.labels[0] ? d.labels[0].total : 1;
  document.getElementById('lablist').innerHTML = d.labels.map((l,i)=>`
    <tr data-name="${l.name.replace(/"/g,'&quot;')}" style="cursor:pointer">
      <td><span class="rank">${i+1}</span></td>
      <td>${l.name}</td>
      <td class="n">${NUM(l.total)}</td>
      <td class="n">${NUM(l.n)}</td>
      <td><span class="bar-mini" style="width:${Math.round(l.total/max*170)}px"></span></td>
    </tr>`).join('');
  document.getElementById('lablist').addEventListener('click', ev=>{
    const tr = ev.target.closest('tr[data-name]'); if (tr) go(tr.dataset.name);
  });
}).catch(e=>{ document.getElementById('err').style.display='block'; console.error(e); });
</script>
</body>
</html>
